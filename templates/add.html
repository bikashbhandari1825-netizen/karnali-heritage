<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Karnali Heritage Place</title>
</head>
<body>
    <div style="max-width: 600px; margin: auto; padding: 20px;">
        <h2>Add New Heritage Place</h2>
        <form method="POST" enctype="multipart/form-data">
            <label>Title:</label><br>
            <input type="text" name="title" required style="width: 100%; margin-bottom: 10px;"><br>
            
            <label>Location:</label><br>
            <input type="text" name="location" required style="width: 100%; margin-bottom: 10px;"><br>
            
            <label>Upload Photo:</label><br>
            <input type="file" name="image" required style="width: 100%; margin-bottom: 10px;"><br>
            
            <label>Description:</label><br>
            <textarea name="description" required style="width: 100%; height: 100px; margin-bottom: 10px;"></textarea><br>
            
            <button type="submit">Save Place</button>
        </form>
        <br>
        <a href="{{ url_for('index') }}">Back to Home</a>
    </div>
</body>
</html>
