<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karnali Heritage Sites</title>
    <style>
    body {
        background-color: #121212;
        color: #ffffff;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
    }
    .main-container {
        max-width: 900px;
        margin: 30px auto;
        padding: 20px;
    }
    .header-title {
        color: #ff9f1a;
        font-size: 28px;
        margin-bottom: 20px;
    }
    .container {
        background-color: #1e1e1e;
        border-radius: 10px;
        padding: 25px;
        margin-bottom: 25px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .container h2 {
        color: #ff9f1a;
        margin-top: 0;
    }
    .container img {
        width: 100%;
        max-height: 400px;
        object-fit: cover;
        border-radius: 8px;
        margin-top: 15px;
        margin-bottom: 15px;
    }
    .btn {
        display: inline-block;
        padding: 12px 24px;
        background-color: #ff9f1a;
        color: #121212;
        text-decoration: none;
        border-radius: 5px;
        font-weight: bold;
    }
    .btn:hover {
        background-color: #e88b0d;
    }
</style>
</head>
<body>
    <div style="max-width: 600px; margin: auto;">
        <h1>Karnali Heritage Sites</h1>
        <a href="/add" class="btn">Add New Place & Photo</a>
        <hr>

        {% for place in places %}
            <div class="container">
                <h2>{{ place.title }}</h2>
                <p><strong>Location:</strong> {{ place.location }}</p>
                <img src="{{ place.image }}" alt="Heritage Photo">
                <p>{{ place.description }}</p>
            </div>
        {% endfor %}
    </div>
</body>
</html>
